<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c7e7ee">
<title>Statistik - Taman Harian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{display:['"Zen Maru Gothic"','ui-rounded','sans-serif'],sans:['Nunito','ui-sans-serif','system-ui','sans-serif']},colors:{forest:'#23443a',moss:'#3f7a5a',meadow:'#8fc48f',mist:'#e8f4ec',dew:'#bfe3e8',petal:'#f4b9c4',sun:'#f6d98b',bark:'#6b5443'}}}}
</script>
<style>
html{-webkit-tap-highlight-color:transparent}
body{font-family:Nunito,sans-serif;color:#23443a;min-height:100vh;background:radial-gradient(circle at 88% 6%,rgba(250,224,148,.6),transparent 32%),radial-gradient(ellipse at 15% 108%,rgba(70,140,90,.32),transparent 52%),linear-gradient(165deg,#c7e7ee 0%,#e5f3e3 45%,#b8dcac 100%);background-attachment:fixed}
.glass{background:rgba(255,255,255,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px -14px rgba(35,68,58,.3)}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.toast{animation:drop .25s ease-out}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.bar{transform-origin:bottom;animation:grow .6s ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="lg:pl-64"><main id="app" class="max-w-5xl mx-auto px-4 sm:px-8 py-6 pb-32 lg:pb-12"></main></div>

<script>
/* ===== shared helpers ===== */
const P={
tasks:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>',
cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
chart:'<path d="M18 20V10M12 20V4M6 20v-6"/>',
out:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>',
menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',
leaf:'<path d="M11 20A7 7 0 019.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.5 2 8 0 5.5-4.8 10-10 10z"/><path d="M2 21c0-3 1.9-5.5 6-7"/>'};
const icon=(n,c='w-5 h-5')=>`<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,type='success'){
  const c={success:'bg-moss',error:'bg-rose-500',info:'bg-forest'}[type];
  const el=document.createElement('div');
  el.className=`toast pointer-events-auto max-w-md w-full sm:w-auto rounded-2xl ${c} text-white px-5 py-3 shadow-xl font-bold text-sm transition-opacity duration-300`;
  el.setAttribute('role','status');el.textContent=msg;$('#toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('opacity-0');setTimeout(()=>el.remove(),300)},3200);
}
async function api(url,opt={}){
  const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt,body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401){location.href='/';throw new Error('Sesi berakhir')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Terjadi kesalahan');
  return j;
}
function shell(){
  const here=location.pathname.replace(/\/$/,'')||'/';
  const NAV=[['/','tasks','Tugas'],['/calendar','cal','Kalender'],['/statistic','chart','Statistik']];
  const link=(h,i,l,cls)=>`<a href="${h}" class="${cls} ${h===here?'bg-white/85 text-forest font-extrabold shadow-sm':'text-forest/70 hover:bg-white/50'}">${icon(i)}<span>${l}</span></a>`;
  const side=NAV.map(n=>link(...n,'flex items-center gap-3 rounded-2xl px-4 py-3')).join('')+`<button data-logout class="flex items-center gap-3 rounded-2xl px-4 py-3 text-forest/70 hover:bg-white/50 mt-auto w-full">${icon('out')}<span>Keluar</span></button>`;
  const brand=`<div class="flex items-center gap-2 font-display font-bold text-xl mb-6 text-moss">${icon('leaf','w-7 h-7')}<span class="text-forest">Taman Harian</span></div>`;
  document.body.insertAdjacentHTML('afterbegin',`
  <div id="toasts" class="fixed top-3 inset-x-0 z-[100] flex flex-col items-center gap-2 px-4 pointer-events-none" style="top:max(.75rem,env(safe-area-inset-top))"></div>
  <aside class="hidden lg:flex fixed inset-y-0 left-0 w-64 flex-col p-5 glass rounded-r-[32px]">${brand}<div class="flex flex-col gap-1 flex-1">${side}</div></aside>
  <header class="lg:hidden sticky top-0 z-30 glass flex items-center gap-3 px-4 pb-3" style="padding-top:max(.75rem,env(safe-area-inset-top))">
    <button id="burger" aria-label="Buka menu" class="p-2 -ml-2 rounded-xl hover:bg-white/60">${icon('menu','w-6 h-6')}</button>
    <span class="font-display font-bold text-lg">Taman Harian</span></header>
  <div id="drawer" class="fixed inset-0 z-40 hidden"><div id="scrim" class="absolute inset-0 bg-forest/40"></div>
    <aside class="absolute left-0 inset-y-0 w-72 flex flex-col p-5 bg-mist rounded-r-[32px] shadow-2xl">${brand}<div class="flex flex-col gap-1 flex-1">${side}</div></aside></div>
  <nav class="lg:hidden fixed bottom-0 inset-x-0 z-30 glass flex justify-around pt-2" style="padding-bottom:max(.5rem,env(safe-area-inset-bottom))">
    ${NAV.map(([h,i,l])=>`<a href="${h}" class="flex flex-col items-center gap-0.5 px-5 py-1 text-xs font-bold ${h===here?'text-moss':'text-forest/55'}">${icon(i,'w-6 h-6')}${l}</a>`).join('')}</nav>`);
  const dr=$('#drawer');
  $('#burger').onclick=()=>dr.classList.remove('hidden');
  $('#scrim').onclick=()=>dr.classList.add('hidden');
  document.querySelectorAll('[data-logout]').forEach(b=>b.onclick=async()=>{try{await api('/api/logout',{method:'POST'})}catch{}location.href='/'});
}
const sprout=n=>{const l=Math.min(Math.max(n,0),6);let s=`<svg viewBox="0 0 80 92" class="w-14 h-16" aria-hidden="true"><path d="M40 88V${72-l*9}" stroke="#3f7a5a" stroke-width="4" stroke-linecap="round"/>`;
  for(let i=0;i<l;i++){const y=80-i*9,x=i%2?1:-1,a=x*26,b=x*28;s+=`<path d="M40 ${y}q${a} -4 ${b} -22q${-a} 2 ${-b} 22z" fill="${i%2?'#8fc48f':'#6fb17d'}"/>`}
  return s+'<ellipse cx="40" cy="89" rx="22" ry="3" fill="#6b5443" opacity=".35"/></svg>'};

/* ===== statistic app ===== */
let D=null,view=location.hash.slice(1)||'overview';
const TABS=[['overview','Ringkasan'],['daily','Harian'],['weekly','Mingguan'],['monthly','Bulanan'],['analysis','Analisis']];
const rate=r=>r.total?Math.round(r.done/r.total*100):null;
const pct=(a,b)=>b?Math.round(a/b*100):null;
const fmtP=p=>p==null?'-':p+'%';
const barColor=p=>p==null?'#d5dfd6':p>=80?'#5fae78':p>=50?'#f0c866':'#ee9aa8';
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONL=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DOW=['','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dm=s=>`${+s.slice(8,10)} ${MON[+s.slice(5,7)-1]}`;
const CFG={
  daily:{rows:()=>D.daily,lab:r=>r.k.slice(8),name:r=>new Date(r.k+'T00:00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'}),min:720,title:'30 hari terakhir',prev:'hari sebelumnya'},
  weekly:{rows:()=>D.weekly,lab:r=>dm(r.k),name:r=>`${dm(r.k)} - ${dm(addDays(r.k,6))}`,min:640,title:'12 pekan terakhir',prev:'pekan sebelumnya'},
  monthly:{rows:()=>D.monthly,lab:r=>MON[+r.k.slice(5)-1],name:r=>`${MONL[+r.k.slice(5)-1]} ${r.k.slice(0,4)}`,min:560,title:'12 bulan terakhir',prev:'bulan sebelumnya'}
};
const card=(inner,cls='')=>`<section class="glass rounded-[28px] p-5 ${cls}">${inner}</section>`;
const kpi=(label,val,sub,color='')=>`<div class="glass rounded-[24px] p-4"><p class="text-xs font-bold text-forest/60">${label}</p><p class="font-display font-bold text-3xl mt-1 ${color}">${val}</p><p class="text-xs text-forest/60 mt-1">${sub}</p></div>`;
const meter=(p,h='h-2.5')=>`<div class="${h} rounded-full bg-white/70 overflow-hidden"><div class="h-full rounded-full" style="width:${p||0}%;background:${barColor(p)}"></div></div>`;

function bars(rows,lab,name,minw){
  return `<div class="overflow-x-auto pb-1"><div style="min-width:${minw}px">
  <div class="flex items-end gap-1.5 h-44 pt-2">${rows.map(r=>{const p=rate(r);return `<div class="flex-1 h-full flex items-end" title="${esc(name(r))}: ${r.done}/${r.total} (${fmtP(p)})"><div class="bar w-full rounded-t-lg" style="height:${p==null?2:Math.max(p,3)}%;background:${barColor(p)}"></div></div>`}).join('')}</div>
  <div class="flex gap-1.5 mt-1">${rows.map(r=>`<div class="flex-1 text-center text-[10px] font-bold text-forest/60">${lab(r)}</div>`).join('')}</div>
  <div class="flex gap-1.5">${rows.map(r=>`<div class="flex-1 text-center text-[10px] text-forest/50">${fmtP(rate(r)).replace('%','')}</div>`).join('')}</div></div></div>`;
}
function period(key){
  const c=CFG[key],rows=c.rows(),tot=rows.reduce((a,r)=>a+r.total,0),dn=rows.reduce((a,r)=>a+r.done,0);
  const act=rows.filter(r=>r.total),best=act.reduce((a,r)=>!a||rate(r)>rate(a)?r:a,null),worst=act.reduce((a,r)=>!a||rate(r)<rate(a)?r:a,null);
  const tbl=rows.map((r,i)=>{const p=rate(r),pp=i?rate(rows[i-1]):null,d=p!=null&&pp!=null?p-pp:null;return {r,p,d}}).reverse();
  return `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
    ${kpi('Tingkat selesai',fmtP(pct(dn,tot)),`${dn} dari ${tot} tugas`)}
    ${kpi('Tugas selesai',dn,c.title)}
    ${kpi('Terbaik',best?fmtP(rate(best)):'-',best?c.name(best):'Belum ada data','text-emerald-700')}
    ${kpi('Terendah',worst?fmtP(rate(worst)):'-',worst?c.name(worst):'Belum ada data','text-rose-600')}</div>
  ${card(`<h2 class="font-display font-bold text-lg mb-2">Persentase tugas selesai, ${c.title}</h2>${bars(rows,c.lab,c.name,c.min)}
    <p class="text-xs text-forest/60 mt-3">Hijau 80% ke atas, kuning 50-79%, merah muda di bawah 50%, abu-abu tidak ada tugas.</p>`,'mt-4')}
  ${card(`<h2 class="font-display font-bold text-lg mb-3">Rincian</h2><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-forest/60"><th class="py-2 pr-3 font-bold">Periode</th><th class="pr-3 font-bold">Selesai</th><th class="pr-3 font-bold w-1/3">Tingkat</th><th class="font-bold text-right">vs ${c.prev}</th></tr></thead><tbody>
  ${tbl.map(({r,p,d})=>`<tr class="border-t border-forest/10"><td class="py-2 pr-3 font-semibold whitespace-nowrap">${c.name(r)}</td><td class="pr-3 whitespace-nowrap">${r.done}/${r.total}</td><td class="pr-3">${r.total?`<div class="flex items-center gap-2"><div class="flex-1">${meter(p)}</div><b class="w-10 text-right">${p}%</b></div>`:'<span class="text-forest/40">Tidak ada tugas</span>'}</td>
  <td class="text-right font-bold whitespace-nowrap ${d==null?'text-forest/40':d>0?'text-emerald-700':d<0?'text-rose-600':''}">${d==null?'-':d>0?'▲ +'+d:d<0?'▼ '+d:'0'}</td></tr>`).join('')}</tbody></table></div>`,'mt-4')}`;
}
function overview(){
  const t=D.totals,s=D.streak,w=D.weekly,cw=w[w.length-1],pw=w[w.length-2];
  const wr=rate(cw),pr=rate(pw),dl=wr!=null&&pr!=null?wr-pr:null;
  const acc=t.est?Math.round(t.act/t.est*100):null;
  const last7=D.daily.slice(-7),l30=D.daily.reduce((a,r)=>({t:a.t+r.total,d:a.d+r.done}),{t:0,d:0});
  return `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
    ${kpi('Tingkat selesai (total)',fmtP(pct(t.done,t.total)),`${t.done} dari ${t.total} tugas`)}
    ${kpi('Tepat waktu',fmtP(pct(t.on_time,t.done)),`${t.on_time} dari ${t.done} selesai`)}
    ${kpi('Tugas terlewat',t.overdue,'belum selesai lewat tenggat',t.overdue?'text-rose-600':'text-emerald-700')}
    ${kpi('Akurasi estimasi',acc==null?'-':acc+'%',acc==null?'isi estimasi dan aktual':acc>110?'butuh lebih lama dari estimasi':acc<90?'lebih cepat dari estimasi':'estimasi sangat pas')}</div>
  <div class="grid lg:grid-cols-3 gap-4 mt-4">
    ${card(`<h2 class="font-display font-bold text-lg">Streak</h2><div class="flex items-center gap-4 mt-2">${sprout(s.current)}<div>
      <p class="font-display font-bold text-4xl">${s.current}<span class="text-base font-bold text-forest/60"> hari</span></p>
      <p class="text-sm text-forest/70">Terpanjang ${s.longest} hari</p>
      <p class="text-xs mt-1 font-bold ${s.todayDone?'text-emerald-700':'text-amber-700'}">${s.todayDone?'Hari ini sudah terhitung':'Selesaikan 1 tugas hari ini agar streak lanjut'}</p></div></div>`)}
    ${card(`<h2 class="font-display font-bold text-lg">Pekan ini</h2><p class="font-display font-bold text-4xl mt-2">${fmtP(wr)}</p>
      <p class="text-sm text-forest/70">${cw.done} dari ${cw.total} tugas jatuh tempo sampai hari ini</p>
      <p class="text-sm font-bold mt-1 ${dl==null?'text-forest/50':dl>=0?'text-emerald-700':'text-rose-600'}">${dl==null?'Belum ada pembanding pekan lalu':(dl>=0?'▲ +':'▼ ')+dl+' poin dari pekan lalu ('+fmtP(pr)+')'}</p>`)}
    ${card(`<h2 class="font-display font-bold text-lg">30 hari terakhir</h2><p class="font-display font-bold text-4xl mt-2">${fmtP(pct(l30.d,l30.t))}</p><p class="text-sm text-forest/70">${l30.d} dari ${l30.t} tugas selesai</p>${meter(pct(l30.d,l30.t),'h-3 mt-3')}`)}
  </div>
  ${card(`<h2 class="font-display font-bold text-lg mb-2">7 hari terakhir</h2>${bars(last7,r=>new Date(r.k+'T00:00:00').toLocaleDateString('id-ID',{weekday:'short'}),r=>r.k,320)}`,'mt-4')}`;
}
function group(rows,nameFn){
  const list=rows.filter(r=>r.total).map(r=>({...r,p:rate(r)})).sort((a,b)=>a.p-b.p||b.total-a.total);
  return list.length?list.map(r=>`<div class="py-2.5 border-t border-forest/10 first:border-0"><div class="flex justify-between gap-3 text-sm"><b class="truncate">${esc(nameFn(r))}</b><span class="whitespace-nowrap text-forest/70">${r.done}/${r.total}${r.late!=null?`, telat ${r.late}`:''} <b class="text-forest">${r.p}%</b></span></div><div class="mt-1.5">${meter(r.p)}</div></div>`).join(''):'<p class="text-sm text-forest/60">Belum ada data 90 hari terakhir.</p>';
}
function insights(){
  const bad=[],good=[],MIN=3,t=D.totals,s=D.streak;
  const cats=D.category.filter(r=>r.total>=MIN).map(r=>({...r,p:rate(r)})).sort((a,b)=>a.p-b.p);
  if(cats.length){const w=cats[0],b=cats[cats.length-1];
    if(w.p<80)bad.push(`Kategori "${w.k}" paling lemah: hanya ${w.p}% selesai (${w.done} dari ${w.total} tugas dalam 90 hari). Pecah tugasnya jadi langkah kecil atau turunkan jumlah per hari.`);
    if(cats.length>1&&b.p>=80)good.push(`Kategori "${b.k}" paling kuat dengan ${b.p}% selesai. Pakai pola yang sama untuk kategori lain.`)}
  const days=D.weekday.filter(r=>r.total>=MIN).map(r=>({...r,p:rate(r)})).sort((a,b)=>a.p-b.p);
  if(days.length>1){const w=days[0],b=days[days.length-1];
    if(w.p<80&&w.p<b.p)bad.push(`Hari ${DOW[w.k]} paling sering gagal: ${w.p}% selesai. Kurangi beban di hari ini atau pindahkan tugas berat ke hari ${DOW[b.k]} (${b.p}%).`);
    if(b.p>=80)good.push(`Hari ${DOW[b.k]} adalah hari terbaikmu dengan ${b.p}% selesai.`)}
  const hi=D.priority.find(r=>r.k==='high'&&r.total>=MIN);
  if(hi&&rate(hi)<70)bad.push(`Tugas prioritas tinggi hanya ${rate(hi)}% selesai. Kerjakan tugas prioritas tinggi lebih dulu di pagi hari.`);
  if(hi&&rate(hi)>=90)good.push(`Prioritas tinggi hampir selalu selesai (${rate(hi)}%). Fokusmu sudah tepat.`);
  const dn=D.category.reduce((a,r)=>a+r.done,0),lt=D.category.reduce((a,r)=>a+r.late,0);
  if(dn>=MIN&&lt/dn>.3)bad.push(`${Math.round(lt/dn*100)}% tugas selesai setelah lewat tenggat. Beri tenggat yang lebih realistis atau mulai lebih awal.`);
  if(t.overdue>0)bad.push(`Ada ${t.overdue} tugas terlewat yang belum selesai. Selesaikan, jadwalkan ulang, atau hapus agar daftar tetap jujur.`);
  if(t.est>0){const a=t.act/t.est;
    if(a>1.2)bad.push(`Waktu aktual rata-rata ${Math.round(a*100)}% dari estimasi. Tambahkan buffer sekitar ${Math.round((a-1)*100)}% saat memperkirakan durasi.`);
    else if(a<.8)good.push(`Kamu lebih cepat dari estimasi (${Math.round(a*100)}%). Estimasimu terlalu longgar, boleh menambah tugas.`);
    else good.push(`Estimasi waktumu akurat (${Math.round(a*100)}% dari perkiraan).`)}
  if(s.current===0)bad.push('Streak sedang 0. Selesaikan satu tugas kecil hari ini untuk memulai lagi.');
  else if(s.current>=7)good.push(`Streak ${s.current} hari berturut-turut. Pertahankan.`);
  if(t.total>=MIN&&t.on_time/Math.max(t.done,1)>=.9)good.push(`${pct(t.on_time,t.done)}% tugas selesai tepat waktu.`);
  return {bad,good};
}
function analysis(){
  const {bad,good}=insights(),li=(a,c)=>a.length?a.map(x=>`<li class="flex gap-2 py-2"><span class="mt-2 w-2 h-2 rounded-full shrink-0 ${c}"></span><span>${esc(x)}</span></li>`).join(''):'<li class="text-sm text-forest/60 py-2">Belum cukup data (minimal 3 tugas per kelompok).</li>';
  return `<div class="grid md:grid-cols-2 gap-4">
    ${card(`<h2 class="font-display font-bold text-lg text-rose-700">Perlu diperbaiki</h2><ul class="mt-1">${li(bad,'bg-rose-400')}</ul>`)}
    ${card(`<h2 class="font-display font-bold text-lg text-emerald-700">Sudah bagus</h2><ul class="mt-1">${li(good,'bg-emerald-500')}</ul>`)}</div>
  <div class="grid md:grid-cols-2 gap-4 mt-4">
    ${card(`<h2 class="font-display font-bold text-lg">Kategori, terlemah dulu</h2><p class="text-xs text-forest/60 mb-2">90 hari terakhir</p>${group(D.category,r=>r.k)}`)}
    ${card(`<h2 class="font-display font-bold text-lg">Hari dalam pekan</h2><p class="text-xs text-forest/60 mb-2">90 hari terakhir, terlemah dulu</p>${group(D.weekday.map(r=>({...r,late:null})),r=>DOW[r.k])}`)}
    ${card(`<h2 class="font-display font-bold text-lg">Prioritas</h2><p class="text-xs text-forest/60 mb-2">90 hari terakhir</p>${group(D.priority,r=>({high:'Tinggi',medium:'Sedang',low:'Rendah'}[r.k]))}`,'md:col-span-2')}</div>`;
}
function render(){
  if(!TABS.some(t=>t[0]===view))view='overview';
  const body=view==='overview'?overview():view==='analysis'?analysis():period(view);
  $('#app').innerHTML=`<h1 class="font-display font-bold text-2xl sm:text-3xl">Statistik</h1>
  <p class="text-sm text-forest/70 mt-1">Diperbarui ${new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}. Tingkat selesai dihitung dari tugas yang jatuh tempo sampai hari ini.</p>
  <div class="flex gap-1 overflow-x-auto mt-4 mb-4 -mx-4 px-4 sm:mx-0 sm:px-0" role="tablist">${TABS.map(([k,l])=>`<a href="#${k}" role="tab" class="shrink-0 px-4 py-2 rounded-full text-sm font-bold ${k===view?'bg-moss text-white':'glass text-forest/70'}">${l}</a>`).join('')}</div>${body}`;
}
async function init(){
